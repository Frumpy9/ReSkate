name: Validate Proton Oodle paths
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch or commit to validate
        required: true
        default: fix/proton-oodle-release-paths
permissions:
  contents: read
jobs:
  linux-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - run: python3 -m unittest discover -s contrib/Test -p '*_tests.py' -v
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Portable ZIP regression tests
        run: python -m unittest discover -s contrib/Test -p '*_tests.py' -v
      - name: Configure the supported MSVC build
        run: cmake --preset vs2022-x64 -DDINGOSDK_BUILD_LAUNCHER_TESTS=ON -DDINGOSDK_CARGO=OFF
      - name: Build the loader fixtures
        run: cmake --build --preset release --target dingosdk_oodle_path_tests --parallel 4
      - name: Run Windows regression tests
        run: ctest --test-dir build/vs2022-x64 -C Release -R '^oodle_path$' --output-on-failure
      - name: Preserve the patched loader fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/patched, artifacts/baseline, artifacts/codec | Out-Null
          Copy-Item build/vs2022-x64/Release/dingosdk_oodle_path_tests.exe artifacts/patched/
          Copy-Item build/vs2022-x64/oodle-fixture/Release/oo2core_9_win64.dll artifacts/codec/
      - name: Restore only the baseline codec source in this temporary runner
        shell: pwsh
        run: |
          @'
          import pathlib, subprocess
          subprocess.check_call(["git", "fetch", "--depth=1", "origin", "22758a789e1d3c754ef7bbf414c0784d8b4a2114"])
          source = subprocess.check_output(["git", "show", "22758a789e1d3c754ef7bbf414c0784d8b4a2114:Engine/Resource/cas_codec.cpp"])
          pathlib.Path("Engine/Resource/cas_codec.cpp").write_bytes(source)
          '@ | python -
      - name: Build the baseline loader fixture
        run: cmake --build --preset release --target dingosdk_oodle_path_tests --parallel 4
      - name: Preserve the baseline loader fixture
        shell: pwsh
        run: Copy-Item build/vs2022-x64/Release/dingosdk_oodle_path_tests.exe artifacts/baseline/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oodle-path-fixtures
          path: artifacts/
          retention-days: 7
